<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuovo Torneo – Elo del Gruppo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="index.html">🃏 <span id="brand-name">Elo del Gruppo</span></a>
    <div class="nav-links">
      <a href="index.html">Classifica</a>
      <a href="players.html">Giocatori</a>
      <a href="new-tournament.html" class="active">Nuovo Torneo</a>
      <a href="settings.html">Impostazioni</a>
    </div>
  </div>
</nav>

<div class="container">
  <h1>Registra un nuovo torneo</h1>
  <p class="subtitle">Prima i partecipanti e i loro mazzi (fissi per tutto il torneo), poi i risultati turno per turno.</p>

  <div id="msg-area"></div>

  <!-- STEP 1: partecipanti e mazzi -->
  <div id="step-1">
    <div class="card">
      <div class="form-row">
        <div>
          <label for="tournament-date">Data del torneo</label>
          <input type="date" id="tournament-date" required>
        </div>
        <div>
          <label for="rounds-count">Numero di turni</label>
          <input type="text" inputmode="numeric" id="rounds-count" value="3">
        </div>
      </div>
    </div>

    <h2>Partecipanti</h2>
    <div class="card">
      <div id="participants-list"></div>
      <div style="margin-top:16px;">
        <button type="button" class="btn secondary" id="add-participant-btn">+ Aggiungi giocatore</button>
      </div>
    </div>

    <div id="step1-msg"></div>

    <div class="step-nav">
      <button type="button" class="btn" id="to-step2-btn">Avanti: inserisci risultati →</button>
    </div>
  </div>

  <!-- STEP 2: risultati turno per turno -->
  <div id="step-2" hidden>
    <div id="rounds-container"></div>

    <div id="step2-msg"></div>

    <div class="step-nav">
      <button type="button" class="btn secondary" id="back-to-step1-btn">← Torna ai partecipanti</button>
      <button type="button" class="btn" id="save-tournament-btn">Salva torneo</button>
    </div>
  </div>

  <p class="footer-note">Serve un token GitHub configurato in <a href="settings.html">Impostazioni</a> per poter salvare.</p>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/elo.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/github-api.js"></script>
<script src="assets/js/combobox.js"></script>
<script src="assets/js/page-new-tournament.js"></script>
</body>
</html>
